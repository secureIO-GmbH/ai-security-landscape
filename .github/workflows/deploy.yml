name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deploy. Don't cancel an in-progress run — wait for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # secureIO whitelabel overrides. Repo link, theme-aware logo,
          # footer byline pointing at secure-io.de, and a link to the
          # legal Impressum page.
          REPO_URL: https://github.com/secureIO-GmbH/ai-security-landscape
          BRAND_LOGO_LIGHT: /branding/secureio-logo-black.png
          BRAND_LOGO_DARK: /branding/secureio-logo-white.png
          BRAND_LOGO_HREF: https://secure-io.de/
          BRAND_LOGO_ALT: secureIO
          FOOTER_PROJECT_BY_TEXT: www.secure-io.de
          FOOTER_PROJECT_BY_URL: https://www.secure-io.de
          FOOTER_IMPRESSUM_URL: https://www.secure-io.de/impressum/
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
